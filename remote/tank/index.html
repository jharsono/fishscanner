<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FishScanner tank</title>
<link rel="icon" href="data:,"><!-- No icon, so the browser does not request /favicon.ico and log the 404 -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a33; }
  canvas { display: block; width: 100%; height: 100%; cursor: none; }
  #problem { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center;
             margin: 0; padding: 1em; color: #fff; font: 1.5em sans-serif; text-align: center; }
  #problem[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="tank"></canvas>
<p id="problem" hidden>This browser cannot draw the tank: it has no WebGL.</p>
<script type="module">
  import { startTank } from "./main.js";

  // On window for the browser's console, and for the tests
  window.tank = startTank(document.getElementById("tank"));
  if (window.tank === null) {
    document.getElementById("problem").hidden = false;
  }
</script>
</body>
</html>
