[project]
name = "fishscanner"
version = "0.1.0"
description = "Scan hand-drawn fish from photos and animate them in a virtual aquarium"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.21.0",
    "opencv-python>=4.7",
    "PyOpenGL>=3.1.6",
    "glfw",
    "pillow-heif",
]

[project.scripts]
fishscanner = "main_ocean:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["engine", "ocean", "main_ocean.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["error"]  # Test output must be pristine

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pyright]
include = ["engine", "ocean", "main_ocean.py", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
